<title>Selector de peso unamas</title>
<style>
/* Layout: header, number, then a stage that owns all remaining height: bar centered in its zone, plate tree pinned above the button */
:root {
  color-scheme: dark;
  --green: #29FF94;
  --green-rim: #1FD67C;
  --bg: #100E11;
  --surface: #2B2B2B;
  --raised: #1C1A1D;
  --divider: #403E41;
  --border: #4F4D50;
  --text: #FCF9FC;
  --muted: #7E7C7F;
  --ink: #100E11;
  --plate: #E7E4E8;
  --plate-rim: #C9C6CA;
  --steel: #5B595C;
  --steel-hi: #7E7C7F;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 8px; }

.app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; padding: 8px 20px 16px; overflow: hidden; }
.back { font-size: 15px; font-weight: 600; color: var(--muted); }
.name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin-top: 4px; }
.last { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 16px; padding: 12px 0;
  border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
.last .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.last .v { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.last .v small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.last .v .cfg { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }

.val { text-align: center; margin-top: 24px; }
.num { display: inline-block; font-size: 80px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; transition: color .25s; }
.num.up { color: var(--green); }
.unit { font-size: 22px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.line { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; min-height: 32px; flex-wrap: wrap; }
.delta { font-size: 15px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.delta.up { color: var(--green); }
.tag { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: var(--raised); }
.reset { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--border); font-variant-numeric: tabular-nums; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 24px; padding-top: 16px; }
.bararea { flex: 1; min-height: 0; position: relative; }
.bar { position: absolute; inset: 0; }
.shaft { position: absolute; border-radius: 2px; background: var(--steel); }
.sleeve { position: absolute; border-radius: 3px; background: var(--steel-hi); }
.collar { position: absolute; border-radius: 3px; background: var(--steel-hi); }
.plate { position: absolute; display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: var(--plate); transition: left .26s cubic-bezier(.4,0,.2,1); }
.plate span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; pointer-events: none; }
.plate.up { background: var(--green); }
.plate::before { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; right: -5px; }

.tree { flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; height: 96px; }
.tp { border-radius: 50%; background: var(--surface);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  transition: transform .12s; }
.tp:active { transform: scale(.94); }
.fly { position: absolute; z-index: 5; pointer-events: none; }

.proto { display: flex; gap: 4px; background: var(--raised); border-radius: 999px; padding: 4px; flex-shrink: 0; margin-bottom: 14px; }
.proto button { flex: 1; padding: 8px 0; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); }
.proto button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* pila de placas, vista de frente */
.stackarea { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: ns-resize; }
.cable { position: absolute; width: 3px; top: 0; background: var(--steel); border-radius: 2px; transform-origin: top; }
.rod { position: absolute; width: 4px; border-radius: 2px; background: var(--steel); }
.stk { position: absolute; left: 0; right: 0; top: 0; transition: transform .25s cubic-bezier(.4,0,.2,1); }
.sp { position: absolute; border-radius: 4px; background: var(--surface); color: var(--muted); display: flex; align-items: center;
  padding-left: 12px; font-weight: 800; font-variant-numeric: tabular-nums; transition: background .12s, color .12s; }
.sp.on { background: var(--plate); color: var(--ink); }
.sp.up { background: var(--green); color: var(--ink); }
.sp i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--bg); }
.knob { position: absolute; border-radius: 50%; background: var(--text); pointer-events: none; z-index: 2;
  transition: top .16s cubic-bezier(.5,0,.2,1); }
.knob::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--steel-hi); }
.stag { position: absolute; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--raised); white-space: nowrap; }
.fade { position: absolute; left: 0; right: 0; height: 40px; pointer-events: none; z-index: 3; transition: opacity .2s; }
.fade.t { top: 0; background: linear-gradient(var(--bg), transparent); }
.fade.b { bottom: 0; background: linear-gradient(transparent, var(--bg)); }

/* rack de mancuernas, vista de frente */
.rackarea { flex: 1; min-height: 0; position: relative; display: flex; }
.rack { flex: 1; display: flex; align-items: stretch; overflow: hidden; touch-action: pan-y; cursor: grab; margin-inline: -20px; } .rackx { overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin-inline: -20px; -webkit-overflow-scrolling: touch; }
.rack::-webkit-scrollbar { display: none; }
.track { display: flex; align-items: stretch; will-change: transform; }
.db { flex: 0 0 auto; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.db .sh { align-self: stretch; height: 6px; margin: 0 -1px; background: var(--steel); }
.db .lb { height: 52px; padding-top: 10px; text-align: center; font-size: 14px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .15s; }
.db.sel .lb { color: var(--text); }
.db .lb small { display: block; margin: 6px auto 0; width: max-content; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--raised); color: var(--text); }
.dbv { display: flex; align-items: center; will-change: transform; }
.dbv .hd { border-radius: 5px; background: var(--surface); transition: background .15s; }
.dbv .hn { border-radius: 3px; background: var(--steel); }
.dbv .fl { width: 4px; border-radius: 2px; background: var(--steel-hi); }
.db.sel .hd { background: var(--plate); }
.db.sel.up .hd { background: var(--green); }
.shelf { height: 6px; border-radius: 3px; background: var(--steel); margin-inline: -20px; }
.labels { display: flex; overflow: hidden; margin-inline: -20px; min-height: 52px; align-items: flex-start; }
.labels b { flex: 0 0 auto; text-align: center; padding-top: 10px; font-size: 14px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .15s; }
.labels b.sel { color: var(--text); }
.labels b small { display: block; margin: 6px auto 0; width: max-content; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--raised); color: var(--text); }

.go { flex-shrink: 0; margin-top: 16px; background: var(--green); color: var(--ink); border-radius: 999px; padding: 16px; width: 100%;
  font-size: 15px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
</style>

<div class="app" id="app">
  <div class="proto" role="group" aria-label="Equipo">
    <button aria-pressed="true" data-k="bar">Barra</button>
    <button aria-pressed="false" data-k="stack">Polea</button>
    <button aria-pressed="false" data-k="db">Mancuernas</button>
  </div>
  <section class="screen" id="s-bar">
  <div class="back">‹ Pierna</div>
  <div class="name">Sentadilla en Smith</div>
  <div class="last"><span class="lab">La última vez · 24 sep</span><span class="v">30 kg<small>por lado · 4×10</small><span class="cfg">20 + 10</span></span></div>
  <div class="val"><span class="num" id="num">0</span><span class="unit">kg por lado</span><div class="line" id="line"></div></div>
  <div class="stage">
    <div class="bararea" id="area"><div class="bar" id="bar"><div class="sleeve" id="slL"></div><div class="sleeve" id="slR"></div><div class="shaft"></div><div class="collar" id="coL"></div><div class="collar" id="coR"></div></div></div>
    <div class="tree" id="tree"></div>
  </div>
  <button class="go" id="go"></button>
  </section>
  <section class="screen" id="s-stack" hidden>
  <div class="back">‹ Hombro</div>
  <div class="name">Laterales en polea</div>
  <div class="last"><span class="lab">La última vez · 27 sep</span><span class="v">7.5 kg<small>4×10</small></span></div>
  <div class="val"><span class="num" id="num2">7.5</span><span class="unit">kg</span><div class="line" id="line2"></div></div>
  <div class="stage">
    <div class="stackarea" id="sarea"><div class="cable" id="cable"></div><div class="stk" id="stk"></div><div class="knob" id="knob"></div><div class="fade t" id="fT"></div><div class="fade b" id="fB"></div></div>
  </div>
  <button class="go" id="go2"></button>
  </section>
  <section class="screen" id="s-db" hidden>
  <div class="back">‹ Hombro</div>
  <div class="name">Press de hombro con mancuernas</div>
  <div class="last"><span class="lab">La última vez · 27 sep</span><span class="v">24 kg<small>c/u · 4×8</small></span></div>
  <div class="val"><span class="num" id="num3">24</span><span class="unit">kg c/u</span><div class="line" id="line3"></div></div>
  <div class="stage">
    <div class="rackarea" id="rarea"><div class="rack" id="rackv"><div class="track" id="rack"></div></div></div>
  </div>
  <button class="go" id="go3"></button>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = v => String(Math.round(v * 100) / 100);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const LAST = 30, LAST_CFG = [20, 10], SUG_CFG = [20, 10, 2.5], SUG = 32.5, DATE = '24', FLOOR = 6;
// relative diameter and thickness (at diameter 240) per plate
const SPEC = { 20: [1, 30], 10: [.8, 24], 5: [.62, 19], 2.5: [.46, 14], 1.25: [.38, 11] };
const WS = [20, 10, 5, 2.5, 1.25];
const app = $('#app'), area = $('#area'), bar = $('#bar'), tree = $('#tree');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let plates = [], pid = 0, G = {};

/* front view of the whole bar: shaft in the middle, one sleeve per side, plates mirrored */
function geo() {
  const w = area.clientWidth, h = area.clientHeight, D = Math.min(h - 8, 220), k = D / 240, cy = h / 2, cx = w / 2;
  const half = Math.max(30, w * .1), cw = 8;
  G = { w, h, D, k, cy, cx, inL: cx - half - cw, inR: cx + half + cw };
  const sh = Math.max(8, D * .045), sl = Math.max(14, D * .075), ch = Math.max(34, D * .22);
  Object.assign($('.shaft').style, { left: (cx - half) + 'px', width: half * 2 + 'px', top: (cy - sh / 2) + 'px', height: sh + 'px' });
  Object.assign($('#slL').style, { left: '-4px', width: (G.inL + 4) + 'px', top: (cy - sl / 2) + 'px', height: sl + 'px' });
  Object.assign($('#slR').style, { left: G.inR + 'px', right: '-4px', top: (cy - sl / 2) + 'px', height: sl + 'px' });
  Object.assign($('#coL').style, { left: (cx - half - cw) + 'px', width: cw + 'px', top: (cy - ch / 2) + 'px', height: ch + 'px' });
  Object.assign($('#coR').style, { left: (cx + half) + 'px', width: cw + 'px', top: (cy - ch / 2) + 'px', height: ch + 'px' });
}
const dims = w => { const [d, t] = SPEC[w]; const D = G.D * d, T = Math.max(6, t * G.k); return { D, T, r: Math.min(4, T / 3) }; };
const offset = (list, i) => list.slice(0, i).reduce((x, p) => x + dims(p.w).T + 2, 2);
const xs = (list, i) => { const o = offset(list, i), T = dims(list[i].w).T; return { L: G.inL - o - T, R: G.inR + o }; };
function mk(p) {
  const el = document.createElement('div'); el.className = 'plate'; el.innerHTML = `<span>${fmt(p.w)}</span>`;
  el.onclick = () => remove(p); bar.append(el); return el;
}
function relayout() {
  const total = plates.reduce((s, p) => s + p.w, 0), up = total > LAST + 1e-9, pool = [...LAST_CFG];
  plates.forEach((p, i) => {
    const j = pool.indexOf(p.w); p.up = up && j < 0; if (j >= 0) pool.splice(j, 1);
    const { D, T, r } = dims(p.w), x = xs(plates, i);
    [[p.L, x.L], [p.R, x.R]].forEach(([el, left]) => {
      const s = el.style; s.width = T + 'px'; s.height = D + 'px'; s.top = (G.cy - D / 2) + 'px'; s.left = left + 'px'; s.borderRadius = r + 'px';
      el.classList.toggle('up', p.up);
      const sp = el.firstChild; sp.style.fontSize = Math.min(12, T * .55) + 'px'; sp.style.display = T >= 12 ? '' : 'none';
    });
  });
  header(total);
}

/* plate tree: plates seen face-on, as on the gym's rack */
const treeEls = {};
function buildTree() {
  tree.innerHTML = '';
  WS.forEach(w => {
    const b = document.createElement('button'), d = Math.max(44, 30 + w * 2.6);
    b.className = 'tp'; b.style.width = b.style.height = d + 'px'; b.textContent = fmt(w);
    b.setAttribute('aria-label', `Cargar disco de ${fmt(w)} kg por lado`);
    b.onclick = () => add(w); tree.append(b); treeEls[w] = b;
  });
}
const rel = el => { const a = app.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height }; };

/* heavier plates travel slower and land harder */
const travel = w => reduced ? 1 : 340 + w * 12;
function land(p) {
  if (reduced) return;
  const k = Math.min(4, .18 * p.w + 1);
  bar.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${k}px)` }, { transform: 'translateY(0)' }],
    { duration: 150 + p.w * 6, easing: 'cubic-bezier(.3,0,.3,1)' });
  buzz(p.w >= 10 ? 22 : p.w >= 5 ? 14 : 8);
}
function fits(w) {
  const per = plates.reduce((s, p) => s + dims(p.w).T + 2, 2) + dims(w).T;
  return G.inL - per >= 4;
}
/* a plate travels in two moves: through the air to the sleeve end, then slides along the sleeve until it hits the next plate */
function fly(from, to, bg0, bg1, dur, slide) {
  const f = document.createElement('div'); f.className = 'fly'; app.append(f);
  const box = (b, bg) => ({ left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px', borderRadius: b.r + 'px', background: bg });
  const via = { ...to, x: to.x + slide };
  return f.animate([
    { ...box(from, bg0), easing: 'cubic-bezier(.3,.7,.3,1)' },
    { ...box(via, bg1), offset: .7, easing: 'cubic-bezier(.6,0,1,.6)' },
    box(to, bg1)
  ], { duration: dur, fill: 'forwards' }).finished.then(() => f.remove());
}
function unfly(from, to, bg0, bg1, slide) {
  const f = document.createElement('div'); f.className = 'fly'; app.append(f);
  const box = (b, bg) => ({ left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px', borderRadius: b.r + 'px', background: bg });
  return f.animate([
    { ...box(from, bg0), easing: 'cubic-bezier(.3,0,.6,1)' },
    { ...box({ ...from, x: from.x + slide }, bg0), offset: .3, easing: 'cubic-bezier(.4,0,.2,1)' },
    box(to, bg1)
  ], { duration: 440, fill: 'forwards' }).finished.then(() => f.remove());
}
function add(w) {
  if (!fits(w)) {
    if (!reduced) treeEls[w].animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 240 });
    buzz([10, 50, 10]); return;
  }
  const p = { id: ++pid, w }; p.L = mk(p); p.R = mk(p);
  p.L.style.visibility = p.R.style.visibility = 'hidden';
  plates.push(p); relayout();               // loads on the outside, in the order you pick
  const s = rel(treeEls[w]), a = rel(area), { D, T, r } = dims(w), i = plates.indexOf(p), x = xs(plates, i), ty = a.y + G.cy - D / 2;
  const from = { ...s, r: s.w / 2 }, bg1 = css(p.up ? '--green' : '--plate'), dur = travel(w) * 1.25, gap = 18;
  Promise.all([
    fly(from, { x: a.x + x.L, y: ty, w: T, h: D, r }, css('--surface'), bg1, dur, -gap),
    fly(from, { x: a.x + x.R, y: ty, w: T, h: D, r }, css('--surface'), bg1, dur, gap)
  ]).then(() => { if (!p.L.isConnected) return; p.L.style.visibility = p.R.style.visibility = ''; land(p); });
}
function remove(p) {
  if (!plates.includes(p) || p.L.style.visibility === 'hidden') return;
  const sL = rel(p.L), sR = rel(p.R), t = rel(treeEls[p.w]), bg = getComputedStyle(p.L).backgroundColor, r = parseFloat(p.L.style.borderRadius);
  plates = plates.filter(q => q !== p); p.L.remove(); p.R.remove(); relayout(); buzz(6);   // outer plates slide in
  if (reduced) return;
  const to = { ...t, r: t.w / 2 };
  Promise.all([unfly({ ...sL, r }, to, bg, css('--surface'), -18), unfly({ ...sR, r }, to, bg, css('--surface'), 18)])
    .then(() => treeEls[p.w].animate([{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' }));
}

/* number rolls between values */
let shown = 0, rollRaf = 0;
function roll(to) {
  cancelAnimationFrame(rollRaf);
  const from = shown, t0 = performance.now(), d = reduced ? 1 : 260, num = $('#num');
  const step = now => {
    const k = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - k, 3), v = from + (to - from) * e;
    num.textContent = fmt(k < 1 ? Math.round(v * 4) / 4 : to); shown = k < 1 ? v : to;
    if (k < 1) rollRaf = requestAnimationFrame(step);
  };
  rollRaf = requestAnimationFrame(step);
}
function header(v) {
  roll(v);
  const up = v > LAST + 1e-9, down = v < LAST - 1e-9, d = fmt(Math.abs(v - LAST)), line = $('#line');
  $('#num').classList.toggle('up', up);
  line.innerHTML = '';
  const de = document.createElement('span'); de.className = 'delta' + (up ? ' up' : '');
  de.textContent = v === 0 ? 'carga la barra' : up ? `+${d} kg · apunta a ${FLOOR} o más` : down ? `−${d} kg que el ${DATE}` : `igual que el ${DATE}`;
  line.append(de);
  if (Math.abs(v - SUG) < 1e-9) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'sugerido'; line.append(t); }
  else if (v > 0) { const b = document.createElement('button'); b.className = 'reset'; b.textContent = `↺ sugerido ${fmt(SUG)}`; b.onclick = toSuggested; line.append(b); }
  $('#go').textContent = `Empezar con ${fmt(v)} kg por lado`;
}
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
async function toSuggested() {
  const out = [...plates].reverse();
  for (const p of out) { remove(p); await wait(60); }
  if (out.length) await wait(300);
  for (const w of SUG_CFG) { add(w); await wait(travel(w) * .75); }
}
addEventListener('resize', () => { if (inited.bar) { geo(); relayout(); } });
function initBar() { geo(); buildTree(); header(0); setTimeout(toSuggested, 350); }

/* ---------- Polea: pila vista de frente; el pasador elige hasta qué placa levantas ---------- */
const S = { last: 7.5, step: 2.5, sug: 7.5, date: '27', same: '4×11', floor: 10 };
const N = Math.round((Math.max(S.last * 2, S.last + 10 * S.step)) / S.step);
const sarea = $('#sarea'), stk = $('#stk'), knob = $('#knob');
let pin = Math.round(S.sug / S.step) - 1, SG = {}, sps = [], shown2 = S.sug, roll2 = 0;
function sgeo() {
  const w = sarea.clientWidth, h = sarea.clientHeight, topPad = 28;
  const pitch = Math.max(26, Math.min(36, (h - topPad - 8) / N)), ph = pitch - 4, pw = Math.min(220, w * .6), x = (w - pw) / 2;
  SG = { w, h, pitch, ph, pw, x, topPad, win: topPad + N * pitch > h };
  stk.innerHTML = ''; sps = [];
  for (const side of [x + pw * .14, x + pw * .86 - 4]) { const r = document.createElement('div'); r.className = 'rod'; Object.assign(r.style, { left: side + 'px', top: '0px', height: (topPad + N * pitch) + 'px' }); stk.append(r); }
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div'); d.className = 'sp';

    d.dbv = d.querySelector('.dbv'); rack.append(d); dbs.push(d);
    centers.push(acc + widths[i] / 2); acc += widths[i];
  });

}
const snapX = i => MG.cw / 2 - centers[i];
const nearest = x => { let i = 0, bd = 1e9; centers.forEach((c, j) => { const d = Math.abs(c + x - MG.cw / 2); if (d < bd) { bd = d; i = j; } }); return i; };

        buzz(w >= 20 ? 14 : 8); };

    }

  const v = dbs[i].dbv, w = MW[i];

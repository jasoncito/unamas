<title>Selector de peso unamas</title>
<style>
/* Layout: one phone-height column. Header, last time, big number, then the equipment selector fills the rest, with the button at the bottom */
:root {
  color-scheme: dark;
  --green: #29FF94;
  --green-d: #12B866;
  --bg: #100E11;
  --surface: #2B2B2B;
  --raised: #1C1A1D;
  --divider: #403E41;
  --border: #4F4D50;
  --text: #FCF9FC;
  --muted: #7E7C7F;
  --ink: #100E11;
  --metal: #D8D5D9;
  --metal-d: #8F8C90;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 8px; }

.app { height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; padding: 8px 20px 16px; }
@media (min-width: 600px) { .app { border-left: 1px solid var(--divider); border-right: 1px solid var(--divider); } }

.proto { display: flex; gap: 4px; background: var(--raised); border-radius: 999px; padding: 4px; flex-shrink: 0; }
.proto button { flex: 1; padding: 8px 0; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); }
.proto button[aria-pressed="true"] { background: var(--surface); color: var(--text); }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.back { font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 14px; }
.name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin-top: 6px; text-wrap: balance; }
.last { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; padding: 12px 0;
  border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
.last .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.last .v { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.last .v small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.last .v .cfg { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }

.val { text-align: center; margin-top: 18px; }
.num { display: inline-block; font-size: 80px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; transition: color .2s; }
.num.up { color: var(--green); }
.unit { font-size: 22px; font-weight: 700; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.line { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; min-height: 30px; flex-wrap: wrap; }
.delta { font-size: 15px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.delta.up { color: var(--green); }
.tag { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: var(--raised); color: var(--text); }
.reset { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--border); color: var(--text); font-variant-numeric: tabular-nums; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative; }
.go { flex-shrink: 0; margin-top: 12px; background: var(--green); color: var(--ink); border-radius: 999px; padding: 16px; text-align: center;
  font-size: 15px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; width: 100%; font-variant-numeric: tabular-nums; }

/* ---------- A: barra con discos ---------- */
.barwrap { position: relative; height: 230px; touch-action: manipulation; }
.shaft { position: absolute; left: -20px; width: 60px; top: 108px; height: 14px; border-radius: 3px;
  background: linear-gradient(180deg, #6E6B6F, #3E3C3F); -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); }
.collar { position: absolute; left: 34px; top: 88px; width: 14px; height: 54px; border-radius: 4px; background: linear-gradient(90deg, #5B595C, #A3A0A4, #5B595C); }
.sleeve { position: absolute; left: 48px; right: 0; top: 104px; height: 22px; border-radius: 4px;
  background: linear-gradient(180deg, #9C999D, #5B595C 55%, #3A383B); }
.plate { position: absolute; left: 0; top: 0; border-radius: 5px; display: flex; align-items: center; justify-content: center;
  transition: transform .32s cubic-bezier(.25,.9,.3,1), top .32s; will-change: transform; cursor: pointer;
  background: linear-gradient(90deg, var(--metal-d) 0%, var(--metal) 30%, #F4F2F5 50%, var(--metal) 70%, var(--metal-d) 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.45); }
.plate.up { background: linear-gradient(90deg, var(--green-d) 0%, var(--green) 35%, #9DFFCC 50%, var(--green) 65%, var(--green-d) 100%); }
.plate span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; pointer-events: none; }
.tray { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; margin-top: 18px; height: 92px; }
.tp { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; border-radius: 14px; padding-bottom: 8px; }
.tp:active { background: var(--raised); }
.tp i { display: block; border-radius: 3px; background: linear-gradient(90deg, #4A484B, #6E6B6F 50%, #4A484B); }
.tp b { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tp b::before { content: "+"; color: var(--muted); margin-right: 1px; }

/* ---------- B: pila de placas ---------- */
.stackarea { position: relative; display: flex; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize; padding: 6px 0 16px; }
.cols { position: relative; display: grid; grid-template-columns: 74px 184px 74px; }
.tags { position: relative; }
.stk { position: relative; }
.sp { position: absolute; left: 0; right: 0; height: 28px; border-radius: 5px; display: flex; align-items: center; padding: 0 12px;
  background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;
  transition: transform .28s cubic-bezier(.25,.9,.3,1), background .18s, color .18s; }
.sp::after { content: ""; position: absolute; right: 22px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); }
.sp.on { background: linear-gradient(180deg, #F2F0F3, var(--metal) 60%, #B5B2B6); color: var(--ink); }
.sp.up { background: linear-gradient(180deg, #8CFFC4, var(--green) 60%, #1FD67C); color: var(--ink); }
.pin { position: absolute; left: 140px; width: 100px; height: 28px; transition: top .22s cubic-bezier(.25,.9,.3,1.2); pointer-events: none; }
.pin .rod { position: absolute; left: 0; right: 30px; top: 11px; height: 6px; border-radius: 3px; background: linear-gradient(180deg, #FFFFFF, #A3A0A4); }
.pin .knob { position: absolute; right: 0; top: -4px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF, #CFCCD0 55%, #8F8C90);
  box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.stag { position: absolute; right: 10px; height: 28px; display: flex; align-items: center; transition: top .2s; }
.stag span { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--raised); color: var(--text); white-space: nowrap; }

/* ---------- C: rack de mancuernas ---------- */
.rack { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; display: flex; align-items: center; height: 250px;
  padding-inline: calc(50% - 40px); margin-inline: -20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.rack::-webkit-scrollbar { display: none; }
.db { flex: 0 0 80px; height: 100%; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dbv { display: flex; flex-direction: column; align-items: center; gap: 12px; will-change: transform, opacity; transform-origin: 50% 70%; }
.dbs { display: flex; align-items: center; }
.dbs .hd { border-radius: 7px; background: linear-gradient(90deg, #5B595C, #8F8C90 50%, #5B595C); transition: background .2s; }
.dbs .hn { height: 9px; width: 16px; background: linear-gradient(180deg, #A3A0A4, #5B595C); }
.db b { font-size: 15px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .2s; }
.db.sel .hd { background: linear-gradient(90deg, var(--metal-d), #F4F2F5 50%, var(--metal-d)); }
.db.sel.up .hd { background: linear-gradient(90deg, var(--green-d), #9DFFCC 50%, var(--green-d)); }
.db.sel b { color: var(--text); }
.db .dt { height: 22px; display: flex; align-items: center; }
.db .dt span { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--raised); white-space: nowrap; }
.floor { height: 2px; margin: -40px -20px 0; background: linear-gradient(90deg, transparent, var(--divider) 20%, var(--divider) 80%, transparent); }

@keyframes nope { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.nope { animation: nope .3s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>

<div class="app">
  <div class="proto" role="group" aria-label="Tipo de equipo">
    <button id="t-bar" aria-pressed="true" data-k="bar">Barra</button>
    <button id="t-stack" aria-pressed="false" data-k="stack">Polea</button>
    <button id="t-db" aria-pressed="false" data-k="db">Mancuernas</button>
  </div>

  <section class="screen" id="s-bar">
    <div class="back">‹ Pierna</div>
    <div class="name">Sentadilla en Smith</div>
    <div class="last"><span class="lab">La última vez · 24 sep</span><span class="v">30 kg<small>por lado · 4×10</small><span class="cfg">20 + 10</span></span></div>
    <div class="val"><span class="num">32.5</span><span class="unit">kg por lado</span><div class="line"></div></div>
    <div class="stage">
      <div class="barwrap" id="barwrap"><div class="shaft"></div><div class="sleeve"></div><div class="collar"></div></div>
      <div class="tray" id="tray"></div>
    </div>
    <button class="go" id="go-bar"></button>
  </section>

  <section class="screen" id="s-stack" hidden>
    <div class="back">‹ Hombro</div>
    <div class="name">Laterales en polea</div>
    <div class="last"><span class="lab">La última vez · 27 sep</span><span class="v">7.5 kg<small>4×10</small></span></div>
    <div class="val"><span class="num">7.5</span><span class="unit">kg</span><div class="line"></div></div>
    <div class="stage">
      <div class="stackarea" id="stackarea"><div class="cols"><div class="tags" id="stags"></div><div class="stk" id="stk"></div><div></div>
        <div class="pin" id="pin"><div class="rod"></div><div class="knob"></div></div></div></div>
    </div>
    <button class="go" id="go-stack"></button>
  </section>

  <section class="screen" id="s-db" hidden>
    <div class="back">‹ Hombro</div>
    <div class="name">Press de hombro con mancuernas</div>
    <div class="last"><span class="lab">La última vez · 27 sep</span><span class="v">24 kg<small>c/u · 4×8</small></span></div>
    <div class="val"><span class="num">24</span><span class="unit">kg c/u</span><div class="line"></div></div>
    <div class="stage">
      <div class="rack" id="rack"></div>
    </div>
    <button class="go" id="go-db"></button>
  </section>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const fmt = v => String(Math.round(v * 100) / 100);
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Data from the real log; suggestion follows PROGRESSION.md
const CFG = {
  bar:   { last: 30,  date: '24', sug: 32.5, floor: 6,  same: null,  unit: 'kg por lado', btn: 'kg por lado' },
  stack: { last: 7.5, date: '27', sug: 7.5,  floor: 10, same: '4×11', unit: 'kg', btn: 'kg' },
  db:    { last: 24,  date: '27', sug: 24,   floor: 8,  same: '4×9',  unit: 'kg c/u', btn: 'kg c/u' },
};
const shown = {};

function header(k, v, onReset) {
  const c = CFG[k], s = $('#s-' + k), num = $('.num', s), line = $('.line', s);
  const up = v > c.last + 1e-9, down = v < c.last - 1e-9, d = fmt(Math.abs(v - c.last));
  if (num.textContent !== fmt(v)) {
    num.textContent = fmt(v);
    if (!reduced) num.animate([{ transform: 'scale(1.07)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'cubic-bezier(.2,.9,.3,1)' });
  }
  num.classList.toggle('up', up);
  let txt = up ? `+${d} kg · apunta a ${c.floor} o más` : down ? `−${d} kg que el ${c.date}` : `igual que el ${c.date}` + (c.same ? ` · apunta a ${c.same}` : '');
  line.innerHTML = '';
  const de = document.createElement('span'); de.className = 'delta' + (up ? ' up' : ''); de.textContent = txt; line.append(de);
  if (Math.abs(v - c.sug) < 1e-9) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'sugerido'; line.append(t); }
  else { const b = document.createElement('button'); b.className = 'reset'; b.textContent = `↺ sugerido ${fmt(c.sug)}`; b.onclick = onReset; line.append(b); }
  $('#go-' + k).textContent = `Empezar con ${fmt(v)} ${c.btn}`;
}

/* ---------------- A: barra ---------------- */
const PL = { 20: [30, 200], 10: [24, 164], 5: [18, 128], 2.5: [12, 96], 1.25: [9, 78] }; // thickness, diameter
const LAST_CFG = [20, 10], SUG_CFG = [20, 10, 2.5];
const barwrap = $('#barwrap'); let plates = [], pid = 0; const pel = new Map();
const tray = $('#tray');
Object.keys(PL).map(Number).sort((a, b) => b - a).forEach(w => {
  const b = document.createElement('button'); b.className = 'tp'; b.setAttribute('aria-label', `Agregar disco de ${fmt(w)} kg`);
  const [t, h] = PL[w]; b.innerHTML = `<i style="width:${Math.max(6, t * .5)}px;height:${h * .38}px"></i><b>${fmt(w)}</b>`;
  b.onclick = () => addPlate(w, b); tray.append(b);
});
const barTotal = () => plates.reduce((s, p) => s + p.w, 0);
function layoutBar(entering) {
  const total = barTotal(), up = total > CFG.bar.last + 1e-9, pool = [...LAST_CFG];
  let x = 52; const W = barwrap.clientWidth;
  plates.forEach(p => {
    const [t, h] = PL[p.w];
    let el = pel.get(p.id);
    const isUp = up && !(pool.includes(p.w) && pool.splice(pool.indexOf(p.w), 1));
    if (!el) {
      el = document.createElement('div'); el.className = 'plate'; el.innerHTML = `<span>${fmt(p.w)}</span>`;
      el.style.width = t + 'px'; el.style.height = h + 'px'; el.style.top = (115 - h / 2) + 'px';
      el.onclick = e => { e.stopPropagation(); removePlate(p.id); };
      barwrap.append(el); pel.set(p.id, el);
      el.style.transform = `translate(${x}px,0)`;
      if (!reduced) el.animate([{ transform: `translate(${W + 20}px,-34px)` }, { transform: `translate(${x}px,0)` }],
        { duration: 420, easing: 'cubic-bezier(.2,1.25,.35,1)' });
    } else el.style.transform = `translate(${x}px,0)`;
    el.classList.toggle('up', isUp);
    x += t + 3;
  });
  header('bar', total, resetBar);
}
function addPlate(w, btn) {
  const used = plates.reduce((s, p) => s + PL[p.w][0] + 3, 52);
  if (used + PL[w][0] > barwrap.clientWidth - 6) { btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope'); buzz([10, 40, 10]); return; }
  plates.push({ id: ++pid, w }); plates.sort((a, b) => b.w - a.w); buzz(12); layoutBar();
}
function removePlate(id) {
  const el = pel.get(id); plates = plates.filter(p => p.id !== id); pel.delete(id); buzz(8);
  const m = /translate\(([-\d.]+)px/.exec(el.style.transform), x = m ? +m[1] : 0;
  el.style.transition = 'none'; el.style.pointerEvents = 'none';
  el.animate([{ transform: `translate(${x}px,0)`, opacity: 1 }, { transform: `translate(${barwrap.clientWidth + 20}px,-34px)`, opacity: 0 }],
    { duration: reduced ? 1 : 260, easing: 'cubic-bezier(.5,0,.8,.4)' }).onfinish = () => el.remove();
  layoutBar();
}
function resetBar() {
  [...plates].forEach(p => removePlate(p.id));
  SUG_CFG.forEach((w, i) => setTimeout(() => { plates.push({ id: ++pid, w }); plates.sort((a, b) => b.w - a.w); layoutBar(); buzz(10); }, 200 + i * 140));
}
function initBar() { header('bar', 0, resetBar); resetBar(); }

/* ---------------- B: pila ---------------- */
const N = 12, STEP = 2.5, PITCH = 32, GAP = 12, lastIdx = 2, sugIdx = 2;
const stk = $('#stk'), stags = $('#stags'), pin = $('#pin'), area = $('#stackarea');
stk.style.height = stags.style.height = (N * PITCH + GAP) + 'px';
const sps = [];
for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'sp'; d.style.top = i * PITCH + 'px'; d.textContent = fmt((i + 1) * STEP); stk.append(d); sps.push(d); }
const tagAt = (i, txt) => { const t = document.createElement('div'); t.className = 'stag'; t.style.top = i * PITCH + 'px'; t.innerHTML = `<span>${txt}</span>`; stags.append(t); };
tagAt(lastIdx, '27 sep');
let pIdx = sugIdx;
function renderStack(tick) {
  sps.forEach((d, i) => {
    d.classList.toggle('on', i <= pIdx && i <= lastIdx);
    d.classList.toggle('up', i <= pIdx && i > lastIdx);
    d.style.transform = i > pIdx ? `translateY(${GAP}px)` : 'none';
  });
  pin.style.top = pIdx * PITCH + 'px';
  if (tick && !reduced) $('.knob', pin).animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 140 });
  header('stack', (pIdx + 1) * STEP, () => setIdx(sugIdx));
}
function setIdx(i) { i = Math.max(0, Math.min(N - 1, i)); if (i !== pIdx) { pIdx = i; buzz(6); renderStack(true); } }
const idxFromY = y => Math.round((y - stk.getBoundingClientRect().top - 14) / PITCH);
let drag = null;
area.addEventListener('pointerdown', e => { area.setPointerCapture(e.pointerId); drag = { y: e.clientY, t: performance.now(), v: 0 }; setIdx(idxFromY(e.clientY)); });
area.addEventListener('pointermove', e => {
  if (!drag) return; const now = performance.now(), dt = Math.max(1, now - drag.t);
  drag.v = .7 * drag.v + .3 * ((e.clientY - drag.y) / dt); drag.y = e.clientY; drag.t = now; setIdx(idxFromY(e.clientY));
});
const endDrag = () => {
  if (!drag) return; const v = drag.v, y0 = drag.y; drag = null;
  if (Math.abs(v) < .3 || reduced) return;
  // inertia: keep travelling and clicking through plates, then settle
  const target = idxFromY(y0 + v * 160); let cur = pIdx; const dir = Math.sign(target - cur);
  const stepOn = (n, delay) => { if (cur === target || n > N) return; setTimeout(() => { cur += dir; setIdx(cur); stepOn(n + 1, delay * 1.35); }, delay); };
  stepOn(0, 45);
};
area.addEventListener('pointerup', endDrag); area.addEventListener('pointercancel', endDrag);
function initStack() { renderStack(); }

/* ---------------- C: mancuernas ---------------- */
const rack = $('#rack'), DBV = []; for (let w = 2; w <= 40; w += 2) DBV.push(w);
const dbs = DBV.map(w => {
  const d = document.createElement('div'); d.className = 'db';
  const hh = 40 + w * 2, hw = 12 + w * .6;
  d.innerHTML = `<div class="dbv"><div class="dt">${w === 24 ? '<span>27 sep</span>' : ''}</div><div class="dbs"><div class="hd" style="width:${hw}px;height:${hh}px"></div><div class="hn"></div><div class="hd" style="width:${hw}px;height:${hh}px"></div></div><b>${w}</b></div>`;
  d.onclick = () => scrollToDb(DBV.indexOf(w), true); rack.append(d); return d;
});
let dbSel = -1, raf = 0;
function paintRack() {
  raf = 0; const mid = rack.scrollLeft + rack.clientWidth / 2; let best = 0, bd = 1e9;
  dbs.forEach((d, i) => {
    const c = d.offsetLeft + d.offsetWidth / 2, dist = c - mid, k = Math.max(0, 1 - Math.abs(dist) / 80);
    if (Math.abs(dist) < bd) { bd = Math.abs(dist); best = i; }
    $('.dbv', d).style.transform = `translateY(${-26 * k}px) scale(${.82 + .5 * k})`;
    $('.dbv', d).style.opacity = .4 + .6 * k;
  });
  if (best !== dbSel) {
    if (dbSel >= 0) dbs[dbSel].classList.remove('sel', 'up');
    dbSel = best; const w = DBV[best];
    dbs[best].classList.add('sel'); dbs[best].classList.toggle('up', w > CFG.db.last);
    buzz(5); header('db', w, () => scrollToDb(DBV.indexOf(CFG.db.sug), true));
  }
}
rack.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(paintRack); }, { passive: true });
function scrollToDb(i, smooth) { const d = dbs[i]; rack.scrollTo({ left: d.offsetLeft + d.offsetWidth / 2 - rack.clientWidth / 2, behavior: smooth && !reduced ? 'smooth' : 'auto' }); }
function initDb() { scrollToDb(DBV.indexOf(CFG.db.sug), false); paintRack(); }

/* ---------------- switcher ---------------- */
const inits = { bar: initBar, stack: initStack, db: initDb };
function show(k) {
  ['bar', 'stack', 'db'].forEach(x => { $('#s-' + x).hidden = x !== k; $(`[data-k="${x}"]`).setAttribute('aria-pressed', x === k); });
  if (!shown[k]) { shown[k] = true; requestAnimationFrame(inits[k]); }
}
document.querySelectorAll('.proto button').forEach(b => b.onclick = () => show(b.dataset.k));
const h = location.hash.slice(1); show(['bar', 'stack', 'db'].includes(h) ? h : 'bar');
</script>
